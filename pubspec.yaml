name: graductaion
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil_plus: ^1.5.0
  google_fonts: ^8.2.1
  font_awesome_flutter: ^11.0.0
  pinput: ^6.0.2

  # Local Storage
  shared_preferences: ^2.5.6

  # Localization
  easy_localization: ^3.0.8
